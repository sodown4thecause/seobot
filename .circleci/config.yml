version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.14.0
    resource_class: medium
    working_directory: ~/project

commands:
  install_dependencies:
    description: Install the pinned pnpm dependencies from the lockfile
    steps:
      - run:
          name: Enable pnpm
          command: |
            echo 'export PNPM_HOME=/home/circleci/.local/share/pnpm' >> "$BASH_ENV"
            echo 'export PATH=$PNPM_HOME/bin:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            corepack enable
            corepack prepare pnpm@11.5.0 --activate
            pnpm --version
            pnpm config set --global store-dir /home/circleci/.pnpm-store
      - restore_cache:
          keys:
            - v2-pnpm-node22-11.5-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "pnpm-workspace.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v2-pnpm-node22-11.5-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "pnpm-workspace.yaml" }}
          paths:
            - /home/circleci/.pnpm-store

jobs:
  validate:
    executor: node
    environment:
      DATABASE_URL: postgresql://ci_user:ci_secure_password@database.invalid/flowintent
      BETTER_AUTH_SECRET: ci-secure-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: https://ci.flowintent.invalid
      NEXT_PUBLIC_SITE_URL: https://ci.flowintent.invalid
      CRON_SECRET: ci-secure-cron-secret-with-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-secure-google-client-secret
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_ci_error_tracking
      POLAR_ACCESS_TOKEN: polar_ci_secure_access_token
      POLAR_PRODUCT_ID: polar_ci_product_id
      POLAR_WEBHOOK_SECRET: polar_ci_secure_webhook_secret
      DATAFORSEO_USERNAME: ci-dataforseo-user
      DATAFORSEO_PASSWORD: ci-secure-dataforseo-password
      REDDIT_CLIENT_ID: ci-reddit-client-id
      REDDIT_CLIENT_SECRET: ci-secure-reddit-client-secret
      UPSTASH_REDIS_REST_URL: https://ci-redis.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-secure-redis-token
      INNGEST_EVENT_KEY: ci-secure-inngest-event-key
      INNGEST_SIGNING_KEY: ci-secure-inngest-signing-key
      AI_GATEWAY_API_KEY: ci-secure-ai-gateway-key
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Validate environment configuration
          command: pnpm run validate:env
      - run:
          name: Lint
          command: pnpm run lint
      - run:
          name: Typecheck
          command: |
            pnpm run typecheck
            pnpm --dir services/geomode-companion build
      - run:
          name: Test
          command: |
            mkdir -p test-results
            pnpm exec vitest run \
              --reporter=default \
              --reporter=junit \
              --outputFile.junit=./test-results/vitest.xml
            pnpm --dir services/geomode-companion test
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results/vitest.xml
          destination: test-results/vitest.xml
          when: always
      - run:
          name: Compile production bundle
          command: pnpm run build
          no_output_timeout: 20m

workflows:
  pull-request-and-main:
    jobs:
      - validate
